# Weekly update PRs for npm packages and for the pinned GitHub Actions (Dependabot keeps the
# commit hashes and their version comments in sync). Minor and patch bumps are grouped into one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # `typescript` is deliberately TypeScript 6 (the API typescript-eslint needs); `tsc` comes from
      # the `@typescript/native` alias. Drop this when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
