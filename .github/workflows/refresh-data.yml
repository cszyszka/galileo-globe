name: Refresh data

# Downloads fresh satellite data and commits it; the push makes Cloudflare rebuild and redeploy.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:refresh -- --force
      - name: Commit and push if changed
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh satellite data"
            git push
          fi
